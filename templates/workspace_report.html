<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execution Report - CRAWL AI</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .report-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #000000;
            min-height: 100vh;
        }
        
        .report-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid #333333;
        }
        
        .report-header h1 {
            color: #ffffff;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .report-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1em;
        }
        
        .score-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
            border: 2px solid #333333;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .score-value {
            font-size: 4em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
        }
        
        .score-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .metric-card {
            background: #1a1a1a;
            border: 2px solid #222222;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        
        .metric-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        
        .metric-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .metric-value {
            color: #ffffff;
            font-size: 2em;
            font-weight: bold;
        }
        
        .tasks-section {
            background: #1a1a1a;
            border: 2px solid #222222;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .tasks-section h2 {
            color: #ffffff;
            font-size: 1.5em;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #333333;
        }
        
        .task-item-report {
            background: #0f0f0f;
            border: 1px solid #222222;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .task-item-report.done {
            border-left: 3px solid #4caf50;
        }
        
        .task-item-report.failed {
            border-left: 3px solid #f44336;
        }
        
        .task-item-report.running {
            border-left: 3px solid #2196f3;
        }
        
        .task-item-report.pending {
            border-left: 3px solid #ff9800;
        }
        
        .task-info {
            flex: 1;
        }
        
        .task-name {
            color: #ffffff;
            font-size: 1.1em;
            font-weight: 500;
            margin-bottom: 5px;
        }
        
        .task-details {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
        }
        
        .task-metrics {
            text-align: right;
        }
        
        .task-time {
            color: #667eea;
            font-size: 1.1em;
            font-weight: bold;
        }
        
        .task-status {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85em;
            text-transform: uppercase;
            margin-top: 5px;
        }
        
        .back-button {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .loading {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            padding: 40px;
        }
        
        .error {
            text-align: center;
            color: #f44336;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="report-container">
        <div class="report-header">
            <h1>Execution Report</h1>
            <p id="reportUrl">Loading...</p>
        </div>
        
        <div id="reportContent">
            <div class="loading">Loading report data...</div>
        </div>
    </div>
    
    <script>
        const sessionId = '{{ session_id }}';
        const API_URL = window.location.origin;
        
        async function loadReport() {
            try {
                const response = await fetch(`${API_URL}/api/workspace/${sessionId}/report`);
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load report');
                }
                
                renderReport(data);
            } catch (error) {
                document.getElementById('reportContent').innerHTML = `
                    <div class="error">
                        <h2>Error Loading Report</h2>
                        <p>${error.message}</p>
                        <a href="/" class="back-button">Back to Home</a>
                    </div>
                `;
            }
        }
        
        function renderReport(data) {
            const metrics = data.metrics || {};
            const score = data.score || 0;
            const tasks = metrics.tasks || [];
            
            // Update URL
            document.getElementById('reportUrl').textContent = data.url || 'N/A';
            
            // Format duration
            const formatDuration = (seconds) => {
                if (!seconds || seconds === 0) return '0.00s';
                if (seconds < 60) return `${seconds.toFixed(2)}s`;
                const mins = Math.floor(seconds / 60);
                const secs = (seconds % 60).toFixed(2);
                return `${mins}m ${secs}s`;
            };
            
            // Format time
            const formatTime = (timestamp) => {
                if (!timestamp) return 'N/A';
                try {
                    return new Date(timestamp * 1000).toLocaleString();
                } catch (e) {
                    return 'N/A';
                }
            };
            
            const reportHTML = `
                <div class="score-card">
                    <div class="score-label">Overall Score</div>
                    <div class="score-value">${score.toFixed(1)}/10</div>
                </div>
                
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-label">Total Tasks</div>
                        <div class="metric-value">${metrics.total_tasks || 0}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Completed</div>
                        <div class="metric-value" style="color: #4caf50;">${metrics.completed_tasks || 0}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Failed</div>
                        <div class="metric-value" style="color: #f44336;">${metrics.failed_tasks || 0}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Total Duration</div>
                        <div class="metric-value">${formatDuration(metrics.total_duration || 0)}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Avg Task Time</div>
                        <div class="metric-value">${formatDuration(metrics.average_task_time || 0)}</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Start Time</div>
                        <div class="metric-value" style="font-size: 1.2em;">${formatTime(metrics.start_time)}</div>
                    </div>
                </div>
                
                <div class="tasks-section">
                    <h2>Task Execution Details</h2>
                    ${tasks && tasks.length > 0 ? tasks.map(task => {
                        const taskName = task.name || task.id || 'Unnamed Task';
                        const taskDesc = task.description || '';
                        const execTime = task.execution_time || 0;
                        const taskStatus = task.status || 'pending';
                        return `
                        <div class="task-item-report ${taskStatus}">
                            <div class="task-info">
                                <div class="task-name">${taskName}</div>
                                <div class="task-details">${taskDesc}</div>
                            </div>
                            <div class="task-metrics">
                                <div class="task-time">${execTime > 0 ? formatDuration(execTime) : 'N/A'}</div>
                                <div class="task-status">${taskStatus}</div>
                            </div>
                        </div>
                        `;
                    }).join('') : '<p style="color: rgba(255,255,255,0.6);">No tasks executed yet.</p>'}
                </div>
                
                <div style="text-align: center;">
                    <a href="/" class="back-button">Back to Home</a>
                </div>
            `;
            
            document.getElementById('reportContent').innerHTML = reportHTML;
        }
        
        // Load report on page load
        loadReport();
    </script>
</body>
</html>
