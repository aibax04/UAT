<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX/QA Automation Agent</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #000000;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .header p {
            font-size: 1em;
            color: #333333;
        }

        .card {
            background: #ffffff;
            border: 2px solid #000000;
            padding: 30px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #000000;
        }

        input[type="text"],
        input[type="url"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #000000;
            background: #ffffff;
            color: #000000;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            background: #f5f5f5;
        }

        .optional-section {
            background: #f5f5f5;
            padding: 20px;
            border: 1px solid #000000;
            margin-top: 20px;
        }

        .optional-section h3 {
            color: #000000;
            font-size: 1em;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .btn {
            background: #000000;
            color: #ffffff;
            padding: 15px 30px;
            border: 2px solid #000000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, color 0.2s;
        }

        .btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .btn:disabled {
            background: #cccccc;
            color: #666666;
            cursor: not-allowed;
            border-color: #cccccc;
        }

        .btn-secondary {
            background: #ffffff;
            color: #000000;
            border: 2px solid #000000;
        }

        .btn-secondary:hover {
            background: #000000;
            color: #ffffff;
        }

        .status-card {
            display: none;
            background: #ffffff;
            border: 2px solid #000000;
            padding: 30px;
            margin-bottom: 20px;
        }

        .status-card.active {
            display: block;
        }

        .status-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #000000;
            padding-bottom: 15px;
        }

        .status-icon {
            width: 40px;
            height: 40px;
            border: 2px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 15px;
            font-weight: bold;
        }

        .status-icon.running {
            background: #ffffff;
            animation: pulse 1.5s infinite;
        }

        .status-icon.completed {
            background: #000000;
            color: #ffffff;
        }

        .status-icon.failed {
            background: #ffffff;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .progress-text {
            font-size: 1em;
            color: #000000;
            margin-bottom: 15px;
        }

        .report-section {
            background: #f5f5f5;
            padding: 20px;
            border: 1px solid #000000;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            max-height: 600px;
            overflow-y: auto;
            line-height: 1.6;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .stat-box {
            background: #ffffff;
            border: 2px solid #000000;
            padding: 20px;
            text-align: center;
        }

        .stat-box .number {
            font-size: 2.5em;
            font-weight: bold;
            color: #000000;
            margin-bottom: 5px;
        }

        .stat-box .label {
            font-size: 0.9em;
            color: #000000;
            text-transform: uppercase;
            font-weight: bold;
        }

        .spinner {
            border: 3px solid #f5f5f5;
            border-top: 3px solid #000000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: #f5f5f5;
            border-left: 4px solid #000000;
            padding: 15px;
            margin-bottom: 20px;
        }

        .info-box p {
            color: #000000;
            margin: 5px 0;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .button-group .btn {
            width: auto;
            flex: 1;
        }

        .report-header {
            border-bottom: 2px solid #000000;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .report-header h2 {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .report-meta {
            font-size: 0.9em;
            color: #333333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>UX/QA Automation Agent</h1>
            <p>Website Analysis & Testing Tool</p>
        </div>

        <div class="card" id="formCard">
            <div class="info-box">
                <p>Enter a website URL to analyze its UX/QA</p>
                <p>Optionally provide login credentials for authenticated testing</p>
            </div>

            <form id="testForm">
                <div class="form-group">
                    <label for="url">Website URL *</label>
                    <input 
                        type="url" 
                        id="url" 
                        name="url" 
                        placeholder="https://example.com" 
                        required
                    >
                </div>

                <div class="optional-section">
                    <h3>Login Credentials (Optional)</h3>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="Enter username if login required"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter password if login required"
                        >
                    </div>
                </div>

                <button type="submit" class="btn" id="startBtn">
                    Start Analysis
                </button>
            </form>
        </div>

        <div class="status-card" id="statusCard">
            <div class="status-header">
                <div class="status-icon running" id="statusIcon">...</div>
                <div>
                    <h2 id="statusTitle">Running Analysis...</h2>
                    <p class="progress-text" id="progressText">Initializing...</p>
                </div>
            </div>

            <div class="spinner" id="spinner"></div>

            <div class="stats" id="stats" style="display: none;">
                <div class="stat-box">
                    <div class="number" id="totalPages">0</div>
                    <div class="label">Pages Crawled</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="totalClicks">0</div>
                    <div class="label">Interactions</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="duration">0s</div>
                    <div class="label">Duration</div>
                </div>
            </div>

            <div id="reportContainer" style="display: none;">
                <div class="report-header">
                    <h2>Analysis Report</h2>
                    <div class="report-meta" id="reportMeta"></div>
                </div>
                <div class="report-section" id="reportSection"></div>
            </div>

            <div class="button-group" id="actionButtons" style="display: none;">
                <button class="btn btn-secondary" id="downloadPdfBtn">
                    Download PDF Report
                </button>
                <button class="btn" id="newTestBtn">
                    New Test
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';
        let currentRunId = null;
        let pollInterval = null;
        let startTime = null;
        let reportData = null;

        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const url = document.getElementById('url').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Hide form, show status
            document.getElementById('formCard').style.display = 'none';
            document.getElementById('statusCard').classList.add('active');

            startTime = Date.now();

            try {
                const response = await fetch(`${API_URL}/api/start-test`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url, username, password })
                });

                const data = await response.json();
                currentRunId = data.run_id;

                // Start polling for status
                pollStatus();
            } catch (error) {
                alert('Error starting test: ' + error.message);
                resetUI();
            }
        });

        async function pollStatus() {
            if (!currentRunId) return;

            try {
                const response = await fetch(`${API_URL}/api/test-status/${currentRunId}`);
                const data = await response.json();

                updateUI(data);

                if (data.status === 'completed') {
                    clearInterval(pollInterval);
                    await loadReport();
                } else if (data.status === 'failed') {
                    clearInterval(pollInterval);
                    showError(data.error || 'Test failed');
                } else {
                    // Continue polling
                    pollInterval = setTimeout(pollStatus, 2000);
                }
            } catch (error) {
                console.error('Polling error:', error);
                pollInterval = setTimeout(pollStatus, 2000);
            }
        }

        function updateUI(data) {
            document.getElementById('progressText').textContent = data.progress || 'Running...';
            
            // Update duration
            if (startTime) {
                const duration = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('duration').textContent = duration + 's';
            }
        }

        async function loadReport() {
            try {
                const response = await fetch(`${API_URL}/api/test-report/${currentRunId}`);
                const data = await response.json();
                reportData = data;

                // Update status icon
                const statusIcon = document.getElementById('statusIcon');
                statusIcon.className = 'status-icon completed';
                statusIcon.textContent = '✓';

                document.getElementById('statusTitle').textContent = 'Analysis Complete';
                document.getElementById('progressText').textContent = 'Report generated successfully';

                // Hide spinner
                document.getElementById('spinner').style.display = 'none';

                // Show stats
                document.getElementById('stats').style.display = 'grid';
                document.getElementById('totalPages').textContent = data.total_pages || 0;
                document.getElementById('totalClicks').textContent = data.total_clicks || 0;

                // Update duration
                if (data.started_at && data.finished_at) {
                    const start = new Date(data.started_at);
                    const end = new Date(data.finished_at);
                    const duration = Math.floor((end - start) / 1000);
                    document.getElementById('duration').textContent = duration + 's';
                }

                // Show report
                const reportContainer = document.getElementById('reportContainer');
                reportContainer.style.display = 'block';
                
                const reportMeta = document.getElementById('reportMeta');
                reportMeta.innerHTML = `
                    <strong>URL:</strong> ${data.url || 'N/A'}<br>
                    <strong>Started:</strong> ${data.started_at ? new Date(data.started_at).toLocaleString() : 'N/A'}<br>
                    <strong>Finished:</strong> ${data.finished_at ? new Date(data.finished_at).toLocaleString() : 'N/A'}
                `;

                const reportSection = document.getElementById('reportSection');
                reportSection.textContent = data.report || 'No report available';

                // Show action buttons
                document.getElementById('actionButtons').style.display = 'flex';
            } catch (error) {
                showError('Error loading report: ' + error.message);
            }
        }

        function showError(message) {
            const statusIcon = document.getElementById('statusIcon');
            statusIcon.className = 'status-icon failed';
            statusIcon.textContent = '✗';

            document.getElementById('statusTitle').textContent = 'Test Failed';
            document.getElementById('progressText').textContent = message;
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('actionButtons').style.display = 'flex';
        }

        function downloadPDF() {
            if (!reportData) {
                alert('No report data available');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Set font
            doc.setFont('helvetica');
            
            // Title
            doc.setFontSize(18);
            doc.setFont('helvetica', 'bold');
            doc.text('UX/QA Analysis Report', 20, 20);
            
            // Meta information
            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            let yPos = 35;
            doc.text(`URL: ${reportData.url || 'N/A'}`, 20, yPos);
            yPos += 7;
            doc.text(`Pages Crawled: ${reportData.total_pages || 0}`, 20, yPos);
            yPos += 7;
            doc.text(`Interactions: ${reportData.total_clicks || 0}`, 20, yPos);
            yPos += 7;
            if (reportData.started_at) {
                doc.text(`Started: ${new Date(reportData.started_at).toLocaleString()}`, 20, yPos);
                yPos += 7;
            }
            if (reportData.finished_at) {
                doc.text(`Finished: ${new Date(reportData.finished_at).toLocaleString()}`, 20, yPos);
                yPos += 7;
            }
            
            // Report content
            yPos += 5;
            doc.setFontSize(12);
            doc.setFont('helvetica', 'bold');
            doc.text('Analysis Report', 20, yPos);
            yPos += 10;
            
            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            
            // Split report text into lines that fit the page
            const reportText = reportData.report || 'No report available';
            const maxWidth = 170; // Page width minus margins
            const lineHeight = 6;
            const pageHeight = 280; // Approximate page height
            const startX = 20;
            
            const lines = doc.splitTextToSize(reportText, maxWidth);
            
            lines.forEach((line) => {
                if (yPos > pageHeight) {
                    doc.addPage();
                    yPos = 20;
                }
                doc.text(line, startX, yPos);
                yPos += lineHeight;
            });
            
            // Save the PDF
            const filename = `UX_QA_Report_${currentRunId || 'report'}.pdf`;
            doc.save(filename);
        }

        function resetUI() {
            document.getElementById('formCard').style.display = 'block';
            document.getElementById('statusCard').classList.remove('active');
            document.getElementById('spinner').style.display = 'block';
            document.getElementById('stats').style.display = 'none';
            document.getElementById('reportContainer').style.display = 'none';
            document.getElementById('actionButtons').style.display = 'none';
            
            // Reset form
            document.getElementById('testForm').reset();
            
            // Reset status
            const statusIcon = document.getElementById('statusIcon');
            statusIcon.className = 'status-icon running';
            statusIcon.textContent = '...';
            document.getElementById('statusTitle').textContent = 'Running Analysis...';
            document.getElementById('progressText').textContent = 'Initializing...';
            
            currentRunId = null;
            startTime = null;
            reportData = null;
        }

        document.getElementById('newTestBtn').addEventListener('click', resetUI);
        document.getElementById('downloadPdfBtn').addEventListener('click', downloadPDF);
    </script>
</body>
</html>
